</style><defs><pattern id="st-orange" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#ffffff"/><rect width="6" height="12" fill="#f08a24"/></pattern><pattern id="st-green" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#ffffff"/><rect width="6" height="12" fill="#2e9e4f"/></pattern><pattern id="st-blue" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#ffffff"/><rect width="6" height="12" fill="#2f6fd6"/></pattern><pattern id="st-brown" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#ffffff"/><rect width="6" height="12" fill="#8b5a2b"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect width="1000" height="1120" rx="16" fill="#ffffff" stroke="#d0d7de"/><text x="40" y="50" class="h1">AirPack4 → Elfin EW11A (RJ45)</text><text x="40" y="74" class="h2">Kabel do bramki Elfin EW11A z gniazdem RJ45</text><text x="40" y="96" class="h2">AirPack socket 10 „AirMobile / Modbus RTU” · gniazdo nr 10 „AirMobile / Modbus RTU”</text><path d="M 220 620 C 220 740, 800 740, 800 620" fill="none" stroke="#8250df" stroke-opacity=".85" stroke-width="40" stroke-linecap="round"/><rect x="422" y="231" width="96" height="30" rx="5" fill="#e9eff5" stroke="#8c959f" stroke-width="2"/><rect x="426" y="227" width="58" height="5" rx="1" fill="#d4a72c"/><path d="M 440 261 L 492 261 L 480 273 L 440 273 Z" fill="#d0d7de" stroke="#8c959f" stroke-width="2"/><rect x="518" y="235" width="40" height="22" rx="4" fill="#8250df" fill-opacity=".85"/><path d="M 455 199 L 455 219" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arr)"/><ellipse cx="455" cy="189" rx="13" ry="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><circle cx="455" cy="189" r="4" fill="#1f2328"/><text x="490" y="297" class="cap" text-anchor="middle">You look at the gold contacts</text><text x="490" y="315" class="cap" text-anchor="middle">Patrzysz na złote styki</text><text x="220.0" y="160" class="dev" text-anchor="middle">AirPack4 end / strona centrali</text><text x="220.0" y="180" class="cap" text-anchor="middle">T568B · all 8 wires / wszystkie 8 żył</text><text x="220.0" y="202" class="cap" text-anchor="middle">View: contacts facing you, latch at the back, cable down</text><text x="220.0" y="220" class="cap" text-anchor="middle">Widok: styki do Ciebie, zatrzask z tyłu, kabel w dół</text><text x="101.0" y="272" class="sig" text-anchor="middle">B−</text><text x="135.0" y="290" class="sig" text-anchor="middle">A+</text><text x="305.0" y="272" class="sig" text-anchor="middle">+24V</text><text x="339.0" y="290" class="sig" text-anchor="middle">GND</text><text x="101.0" y="316" class="pin" text-anchor="middle">1</text><text x="135.0" y="316" class="pin" text-anchor="middle">2</text><text x="169.0" y="316" class="pin" text-anchor="middle">3</text><text x="203.0" y="316" class="pin" text-anchor="middle">4</text><text x="237.0" y="316" class="pin" text-anchor="middle">5</text><text x="271.0" y="316" class="pin" text-anchor="middle">6</text><text x="305.0" y="316" class="pin" text-anchor="middle">7</text><text x="339.0" y="316" class="pin" text-anchor="middle">8</text><rect x="60" y="330" width="320" height="270" rx="16" fill="#e9eff5" fill-opacity=".85" stroke="#8c959f" stroke-width="2.5"/><rect x="74" y="342" width="292" height="74" rx="6" fill="#ffffff" fill-opacity=".6" stroke="#c4ccd4"/><rect x="91.0" y="400" width="20" height="150" rx="3" fill="url(#st-orange)" stroke="#3d444d" stroke-width="1.5"/><rect x="94.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="125.0" y="400" width="20" height="150" rx="3" fill="#f08a24" stroke="#3d444d" stroke-width="1.5"/><rect x="128.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="159.0" y="400" width="20" height="150" rx="3" fill="url(#st-green)" stroke="#3d444d" stroke-width="1.5"/><rect x="162.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="193.0" y="400" width="20" height="150" rx="3" fill="#2f6fd6" stroke="#3d444d" stroke-width="1.5"/><rect x="196.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="227.0" y="400" width="20" height="150" rx="3" fill="url(#st-blue)" stroke="#3d444d" stroke-width="1.5"/><rect x="230.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="261.0" y="400" width="20" height="150" rx="3" fill="#2e9e4f" stroke="#3d444d" stroke-width="1.5"/><rect x="264.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="295.0" y="400" width="20" height="150" rx="3" fill="url(#st-brown)" stroke="#3d444d" stroke-width="1.5"/><rect x="298.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="329.0" y="400" width="20" height="150" rx="3" fill="#8b5a2b" stroke="#3d444d" stroke-width="1.5"/><rect x="332.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="135" y="550" width="170" height="70" rx="10" fill="#8250df" fill-opacity=".85"/><text x="780.0" y="160" class="dev" text-anchor="middle">Elfin EW11A end / strona Elfina</text><text x="780.0" y="180" class="cap" text-anchor="middle">only 4 wires / tylko 4 żyły</text><text x="780.0" y="202" class="cap" text-anchor="middle">View: contacts facing you, latch at the back, cable down</text><text x="780.0" y="220" class="cap" text-anchor="middle">Widok: styki do Ciebie, zatrzask z tyłu, kabel w dół</text><text x="763.0" y="290" class="sig" text-anchor="middle">Rld</text><text x="797.0" y="272" class="sig" text-anchor="middle">A+</text><text x="831.0" y="290" class="sig" text-anchor="middle">B−</text><text x="865.0" y="272" class="sig" text-anchor="middle">VCC</text><text x="899.0" y="290" class="sig" text-anchor="middle">GND</text><text x="661.0" y="316" class="pin" text-anchor="middle">1</text><text x="695.0" y="316" class="pin" text-anchor="middle">2</text><text x="729.0" y="316" class="pin" text-anchor="middle">3</text><text x="763.0" y="316" class="pin" text-anchor="middle">4</text><text x="797.0" y="316" class="pin" text-anchor="middle">5</text><text x="831.0" y="316" class="pin" text-anchor="middle">6</text><text x="865.0" y="316" class="pin" text-anchor="middle">7</text><text x="899.0" y="316" class="pin" text-anchor="middle">8</text><rect x="620" y="330" width="320" height="270" rx="16" fill="#e9eff5" fill-opacity=".85" stroke="#8c959f" stroke-width="2.5"/><rect x="634" y="342" width="292" height="74" rx="6" fill="#ffffff" fill-opacity=".6" stroke="#c4ccd4"/><rect x="651.0" y="400" width="20" height="150" rx="3" fill="none" stroke="#c4ccd4" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="654.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="685.0" y="400" width="20" height="150" rx="3" fill="none" stroke="#c4ccd4" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="688.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="719.0" y="400" width="20" height="150" rx="3" fill="none" stroke="#c4ccd4" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="722.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="753.0" y="400" width="20" height="150" rx="3" fill="none" stroke="#c4ccd4" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="756.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="787.0" y="400" width="20" height="150" rx="3" fill="#f08a24" stroke="#3d444d" stroke-width="1.5"/><rect x="790.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="821.0" y="400" width="20" height="150" rx="3" fill="url(#st-orange)" stroke="#3d444d" stroke-width="1.5"/><rect x="824.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="855.0" y="400" width="20" height="150" rx="3" fill="url(#st-brown)" stroke="#3d444d" stroke-width="1.5"/><rect x="858.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="889.0" y="400" width="20" height="150" rx="3" fill="#8b5a2b" stroke="#3d444d" stroke-width="1.5"/><rect x="892.0" y="348" width="14" height="52" rx="2" fill="#d4a72c" stroke="#9a6d00" stroke-width="1"/><rect x="695" y="550" width="170" height="70" rx="10" fill="#8250df" fill-opacity=".85"/><text x="60" y="800" class="th">AirPack pin</text><text x="170" y="800" class="th">Colour / kolor</text><text x="480" y="800" class="th">→</text><text x="510" y="800" class="th">Gateway / bramka</text><text x="700" y="800" class="th">Signal / sygnał</text><rect x="170" y="813" width="30" height="16" rx="3" fill="#f08a24" stroke="#3d444d"/><text x="60" y="826" class="td">2</text><text x="210" y="826" class="td">orange / pomarańczowy</text><text x="480" y="826" class="td">→</text><text x="510" y="826" class="td">Elfin pin 5</text><text x="700" y="826" class="sig">A+</text><rect x="170" y="839" width="30" height="16" rx="3" fill="url(#st-orange)" stroke="#3d444d"/><text x="60" y="852" class="td">1</text><text x="210" y="852" class="td">white-orange / biało-pomarańczowy</text><text x="480" y="852" class="td">→</text><text x="510" y="852" class="td">Elfin pin 6</text><text x="700" y="852" class="sig">B−</text><rect x="170" y="865" width="30" height="16" rx="3" fill="url(#st-brown)" stroke="#3d444d"/><text x="60" y="878" class="td">7</text><text x="210" y="878" class="td">white-brown / biało-brązowy</text><text x="480" y="878" class="td">→</text><text x="510" y="878" class="td">Elfin pin 7</text><text x="700" y="878" class="sig">VCC (+24 V)</text><rect x="170" y="891" width="30" height="16" rx="3" fill="#8b5a2b" stroke="#3d444d"/><text x="60" y="904" class="td">8</text><text x="210" y="904" class="td">brown / brązowy</text><text x="480" y="904" class="td">→</text><text x="510" y="904" class="td">Elfin pin 8</text><text x="700" y="904" class="sig">GND</text><text x="60" y="930" class="cap">Wires 3–6 (green, blue pairs): cut on the Elfin end · Żyły 3–6 (pary zielona i niebieska): obetnij po stronie Elfina</text><rect x="24" y="954" width="952" height="132" rx="10" fill="#fff8e6" stroke="#e3b341"/><text x="40" y="980" class="noteb">Power / Zasilanie:</text><text x="250" y="980" class="note">AirPack pin 7 = +24 V → OK for EW11A (5–36 V). Plain EW11 (5–18 V): NOT from pin 7, use a 12 V adapter.</text><text x="40" y="1002" class="noteb"></text><text x="250" y="1002" class="note">Zwykły EW11 (5–18 V) NIE z pinu 7 – użyj zasilacza 12 V. EW11A (5–36 V) może być zasilany z centrali.</text><text x="40" y="1024" class="noteb">Check first / Sprawdź:</text><text x="250" y="1024" class="note">~24 V between AirPack pins 7 (+) and 8 (−) before connecting the gateway.</text><text x="40" y="1046" class="noteb">Elfin settings:</text><text x="250" y="1046" class="note">Protocol Modbus · 9600 8N1 · Modbus address 10 · TCP port as set (default 8899).</text><text x="40" y="1068" class="noteb">Tested / Sprawdzone:</text><text x="250" y="1068" class="note">AirPack4 400v Energy++ (socket 10) + Elfin EW11A powered from the AirPack.</text></svg>