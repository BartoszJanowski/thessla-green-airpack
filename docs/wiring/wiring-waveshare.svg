xt><text x="510" y="852" class="td">485B (B−)</text><text x="700" y="852" class="sig">B−</text><rect x="170" y="865" width="30" height="16" rx="3" fill="#8b5a2b" stroke="#3d444d"/><text x="60" y="878" class="td">8</text><text x="210" y="878" class="td">brown / brązowy</text><text x="480" y="878" class="td">→</text><text x="510" y="878" class="td">GND</text><text x="700" y="878" class="sig">GND</text><text x="60" y="904" class="cap">Wires 3–7: not connected (cut) · Żyły 3–7: niepodłączone (obetnij)</text><rect x="24" y="948" width="952" height="88" rx="10" fill="#fff8e6" stroke="#e3b341"/><text x="40" y="974" class="noteb">Power / Zasilanie:</text><text x="250" y="974" class="note">own 12 V adapter (RS485 TO ETH (B) accepts only 9–24 V) · osobny zasilacz 12 V.</text><text x="40" y="996" class="noteb">A/B:</text><text x="250" y="996" class="note">if the unit does not answer, swap A and B · jeśli centrala nie odpowiada, zamień A i B.</text><text x="40" y="1018" class="noteb">Settings:</text><text x="250" y="1018" class="note">Modbus TCP to RTU · 9600 8N1 · Modbus address 10 · TCP port shown by the gateway (502 / 4196).</text></svg>