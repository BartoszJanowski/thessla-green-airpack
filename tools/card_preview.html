<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirPack card preview</title>
<style>
  :root {
    --primary-text-color: #212121; --secondary-text-color: #727272; --primary-color: #03a9f4;
    --secondary-background-color: #e5e5e5; --card-background-color: #fff; --error-color: #db4437;
    --warning-color: #f59e0b; --text-primary-color: #fff;
  }
  body { margin: 0; padding: 16px; font-family: Roboto, system-ui, sans-serif; background: #f2f2f2; }
  .dark { --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --secondary-background-color: #2c2c2c;
          --card-background-color: #1c1c1c; background: #111; }
  h2 { font-size: 14px; color: var(--secondary-text-color); margin: 4px 0 6px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(520px, 100%), 1fr)); gap: 16px; }
  .grid > * { min-width: 0; }
  section { padding: 12px; border-radius: 12px; }
  /* minimal stand-in for HA's ha-card */
  ha-card { display: block; background: var(--card-background-color); border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } body { padding: 16px 16px; } }
</style>
<script src="../custom_components/thessla_green_airpack/frontend/thessla-airpack-card.js"></script>
</head>
<body>
<div class="grid" id="light"></div>
<section class="dark"><div class="grid" id="dark"></div></section>
<script>
const P = "thessla_green_airpack";
const DEV = "dev1";
// entity_id -> [translation_key, state, attributes]
const BASE = {
  "sensor.ap_outside": ["outside_temperature", "6.1"],
  "sensor.ap_supply": ["supply_temperature", "18.6"],
  "sensor.ap_extract": ["exhaust_temperature", "21.6"],
  "sensor.ap_ambient": ["ambient_temperature", "18.6"],
  "sensor.ap_flow_s": ["supply_air_flow", "140"],
  "sensor.ap_flow_e": ["exhaust_air_flow", "140"],
  "sensor.ap_pct_s": ["supply_percentage", "35"],
  "sensor.ap_pct_e": ["exhaust_percentage", "35"],
  "sensor.ap_filter_s": ["supply_filter_wear", "8"],
  "sensor.ap_filter_e": ["exhaust_filter_wear", "6"],
  "sensor.ap_eff": ["heat_recovery_efficiency", "80.6"],
  "sensor.ap_rec_power": ["heat_recovery_power", "612.4"],
  "sensor.ap_rec_today": ["heat_recovery_energy_today", "9.84"],
  "sensor.ap_func": ["active_function", "none"],
  "sensor.ap_bypass_state": ["bypass_state", "inactive"],
  "sensor.ap_comfort_state": ["comfort_state", "inactive"],
  "sensor.ap_alarms": ["active_alarms", "0"],
  "binary_sensor.ap_bypass": ["bypass_actuator", "off"],
  "binary_sensor.ap_fpx": ["antifreeze_mode", "off"],
  "binary_sensor.ap_alarm": ["alarm", "off"],
  "binary_sensor.ap_error": ["error", "off"],
  "binary_sensor.ap_fans": ["power_supply_fans", "on"],
  "fan.ap": ["ventilation", "on", { percentage: 35, preset_mode: "auto" }],
  "switch.ap_power": ["power", "on"],
  "select.ap_season": ["season_mode", "winter"],
  // No ECO / COMFORT: hidden when no duct exchangers (Options -> Installed equipment).
};

const SCENARIOS = [
  ["Your unit at 15:07 (read-only probe)", {}],
  ["Bypass open, summer, free cooling", {
    "binary_sensor.ap_bypass": "on", "sensor.ap_bypass_state": "free_cooling", "select.ap_season": "summer",
    "sensor.ap_outside": "16.0", "sensor.ap_supply": "16.4", "sensor.ap_extract": "24.6", "sensor.ap_eff": "unknown", "sensor.ap_rec_power": "0",
    "fan.ap": ["on", { percentage: 60, preset_mode: "manual" }], "sensor.ap_pct_s": "60", "sensor.ap_pct_e": "60",
    "sensor.ap_flow_s": "240", "sensor.ap_flow_e": "240" }],
  ["FPX active, GWC + duct heater fitted, fireplace", {
    "binary_sensor.ap_fpx": "on", "sensor.ap_outside": "-12.5", "sensor.ap_supply": "15.1", "sensor.ap_eff": "79",
    "sensor.ap_func": "fireplace", "+select.ap_comfort": ["comfort_mode_panel", "comfort"], "sensor.ap_comfort_state": "heating",
    "fan.ap": ["on", { percentage: 45, preset_mode: "temporary" }], "sensor.ap_pct_s": "54", "sensor.ap_pct_e": "45",
    "+sensor.ap_fpx_t": ["fpx_temperature", "-2.0"], "+sensor.ap_gwc_t": ["gwc_temperature", "4.5"],
    "+sensor.ap_gwc_state": ["gwc_state", "winter"], "+sensor.ap_duct_t": ["duct_supply_temperature", "24.5"],
    "sensor.ap_filter_s": "86" }],
  ["Unit off", { "switch.ap_power": "off", "binary_sensor.ap_fans": "off", "fan.ap": ["off", { percentage: 30, preset_mode: "auto" }] }],
  ["Alarm active", { "binary_sensor.ap_error": "on", "sensor.ap_alarms": "2", "sensor.ap_filter_e": "104" }],
  ["Unknown values, no CF (other model)", {
    "sensor.ap_supply": "unknown", "sensor.ap_eff": "unknown", "-sensor.ap_flow_s": 1, "-sensor.ap_flow_e": 1,
    "-sensor.ap_ambient": 1, "-binary_sensor.ap_fpx": 1 }],
];

function buildHass(overrides, lang) {
  const defs = JSON.parse(JSON.stringify(BASE));
  for (const [k, v] of Object.entries(overrides)) {
    if (k.startsWith("+")) defs[k.slice(1)] = v;
    else if (k.startsWith("-")) delete defs[k.slice(1)];
    else if (Array.isArray(v)) { defs[k][1] = v[0]; defs[k][2] = v[1]; }
    else defs[k][1] = v;
  }
  const entities = {}, states = {};
  for (const [id, [tk, state, attrs]] of Object.entries(defs)) {
    entities[id] = { entity_id: id, device_id: DEV, platform: P, translation_key: tk };
    states[id] = { entity_id: id, state, attributes: attrs || {}, last_updated: "1" };
  }
  return { entities, states, devices: { [DEV]: { name: "AirPack" } }, language: lang, locale: { language: lang } };
}

function render(containerId, lang) {
  const root = document.getElementById(containerId);
  for (const [title, overrides] of SCENARIOS) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<h2>${title}</h2>`;
    const card = document.createElement("thessla-airpack-card");
    card.setConfig({});
    card.hass = buildHass(overrides, lang);
    wrap.appendChild(card);
    root.appendChild(wrap);
  }
}
const params = new URLSearchParams(location.search);
const lang = params.get("lang") || "en";
// ?w=360 simulates a phone-width column (Chrome windows cannot be that narrow).
if (params.get("w")) document.body.style.maxWidth = `${params.get("w")}px`;
render("light", lang);
render("dark", lang);
</script>
</body>
</html>
